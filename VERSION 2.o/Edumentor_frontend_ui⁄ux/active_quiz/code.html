<script>
        // Simple interaction demo
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected-correct', 'selected-wrong');
                    c.querySelector('.material-symbols-outlined').textContent = 'radio_button_unchecked';
                });
                
                // Note: The specific classes (selected-correct/wrong) are hardcoded on inline onclicks for demonstration purposes
                // In a real app, this logic would evaluate the answer.
                
                if(this.classList.contains('selected-correct') || this.getAttribute('onclick') === "this.classList.add('selected-correct')") {
                     this.querySelector('.material-symbols-outlined').textContent = 'check_circle';
                     this.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                } else if(this.classList.contains('selected-wrong') || this.getAttribute('onclick') === "this.classList.add('selected-wrong')") {
                     this.querySelector('.material-symbols-outlined').textContent = 'cancel';
                     this.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
